<ion-modal-view>
    <ion-header-bar>
        <div class="buttons">
            <button ng-click="vm.closePopUp()" class="button button-icon icon ion-ios-close-empty"></button>
        </div>
        <h1 class="title"></h1>
    </ion-header-bar>
    <ion-content scroll="false" padding="false">
        <div class="iframe-wrapper">
            <iframe src="{{vm.url}}" frameborder="1"></iframe>
        </div>
    </ion-content>
</ion-modal-view>
